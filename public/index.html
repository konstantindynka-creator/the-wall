<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE WALL</title>
<meta name="description" content="One shared pixel canvas. Everyone online paints it live.">
<meta property="og:title" content="THE WALL">
<meta property="og:description" content="One shared pixel canvas. Everyone online paints it live.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://the-wall-8ief.onrender.com/">
<meta property="og:image" content="https://the-wall-8ief.onrender.com/card.png">
<meta name="twitter:card" content="player">
<meta name="twitter:title" content="THE WALL">
<meta name="twitter:description" content="Everyone who opens this embed paints the same wall.">
<meta name="twitter:image" content="https://the-wall-8ief.onrender.com/card.png">
<meta name="twitter:player" content="https://the-wall-8ief.onrender.com/play">
<meta name="twitter:player:width" content="565">
<meta name="twitter:player:height" content="565">
<meta name="theme-color" content="#0d0e12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Silkscreen:wght@400;700&display=swap">
<style>
  /* Layout: one centered column, canvas is the hero, palette sits under it like a tool tray. */
  :root {
    --bg: #0d0e12;
    --panel: #15171d;
    --line: #262932;
    --fg: #e9e9ee;
    --dim: #8a8d99;
    --live: #3dff8b;
    --hot: #ff4d4d;
    --display: "Silkscreen", "Courier New", monospace;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--mono);
    font-size: 14px;
    min-height: 100vh;
    min-height: 100dvh;
    padding-inline: 16px;
    padding-block: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .col { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(28px, 7vw, 44px);
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .stats { display: flex; gap: 16px; align-items: center; color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .stats b { color: var(--fg); font-weight: 500; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 6px; vertical-align: middle; }
  .dot.on { background: var(--live); box-shadow: 0 0 0 3px rgba(61,255,139,.18); }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--line);
    background: #14151a;
    touch-action: none;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  #wall { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #grid { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity .15s; }
  .stage.zoomgrid #grid { opacity: 1; }
  #peers { position: absolute; inset: 0; pointer-events: none; }
  .peer {
    position: absolute;
    width: calc(100% / 96);
    height: calc(100% / 96);
    outline: 2px solid var(--fg);
    outline-offset: 1px;
    mix-blend-mode: normal;
    transition: left .06s linear, top .06s linear;
  }
  .veil {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(13,14,18,.82); font-family: var(--display); letter-spacing: .08em; font-size: 18px;
  }
  .veil[hidden] { display: none; }

  .tray { display: flex; flex-direction: column; gap: 10px; background: var(--panel); border: 1px solid var(--line); padding: 12px; }
  .palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .sw {
    appearance: none; border: 0; padding: 0; margin: 0;
    aspect-ratio: 1 / 1; width: 100%; cursor: pointer;
    background: var(--c);
    outline: 1px solid rgba(255,255,255,.12); outline-offset: -1px;
    position: relative;
  }
  .sw[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: 2px; }
  .sw:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
  .sw.erase::after { content: "×"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 18px; }

  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }
  button.act {
    font: inherit; font-size: 12px; color: var(--fg); background: transparent;
    border: 1px solid var(--line); padding: 7px 12px; cursor: pointer;
  }
  button.act:hover { border-color: var(--dim); }
  button.act:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
  .brand { color: var(--dim); font-size: 12px; letter-spacing: .06em; }
  .brand b { color: var(--fg); font-weight: 500; }
  @media (max-width: 420px) { .palette { grid-template-columns: repeat(8, 1fr); gap: 4px; } }

  /* Embed mode (/play): fits the square frame X gives a player card. Square canvas, one palette row, online count on the canvas. */
  html.embed body { padding: 8px; gap: 0; min-height: 100vh; justify-content: flex-start; }
  html.embed .col { max-width: none; gap: 8px; align-items: center; }
  html.embed header, html.embed .tray .row, html.embed .col > .row { display: none; }
  html.embed .stage { width: min(100%, calc(100vh - 62px)); }
  html.embed .tray { width: min(100%, calc(100vh - 62px)); padding: 6px; background: transparent; border: 0; }
  html.embed .palette { grid-template-columns: repeat(16, 1fr); gap: 3px; }
  html.embed .stats { position: absolute; top: 6px; left: 6px; z-index: 3; pointer-events: none; gap: 10px; font-size: 11px; padding: 4px 8px; background: rgba(13,14,18,.82); }
  html.embed .veil { font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { .peer { transition: none; } }
</style>
</head>
<body>
<div class="col">
  <header>
    <h1>THE WALL</h1>
    <div class="stats" aria-live="polite">
      <span><span class="dot" id="dot"></span><b id="online">0</b> online</span>
      <span><b id="total">0</b> pixels</span>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="wall" width="96" height="96"></canvas>
    <canvas id="grid"></canvas>
    <div id="peers"></div>
    <div class="veil" id="veil">CONNECTING</div>
  </div>

  <div class="tray">
    <div class="palette" id="palette" role="group" aria-label="Colors"></div>
    <div class="row">
      <span>96 x 96. Drag to paint. Keys 0-9 pick colors.</span>
      <span style="display:flex;gap:8px">
        <button class="act" id="gridbtn" type="button">Grid</button>
        <button class="act" id="savebtn" type="button">Save PNG</button>
      </span>
    </div>
  </div>

  <div class="row"><span class="brand">built by <b>@ashercrw</b></span><span id="status"></span></div>
</div>

<script>
(function () {
  var W = 96, H = 96;
  var COLORS = [
    "#14151a", "#f5f5f0", "#ff4d4d", "#ff9f1c", "#ffe14d", "#7bd957", "#1fa860", "#2ee6d6",
    "#2d9cff", "#3b4cff", "#8b5cf6", "#ff5fcb", "#8a5a3b", "#9aa0a6", "#4b4f58", "#ffd1a6"
  ];
  var grid = new Uint8Array(W * H);
  var cur = 2;
  var myId = 0;
  var ws = null;
  var retry = 0;

  var stage = document.getElementById("stage");
  var wall = document.getElementById("wall");
  var ctx = wall.getContext("2d");
  var peersEl = document.getElementById("peers");
  var veil = document.getElementById("veil");
  var onlineEl = document.getElementById("online");
  var totalEl = document.getElementById("total");
  var dot = document.getElementById("dot");
  var statusEl = document.getElementById("status");
  var palette = document.getElementById("palette");

  // compact mode for the X player card: same game, square layout
  if (location.pathname === "/play") {
    document.documentElement.classList.add("embed");
    stage.appendChild(document.querySelector(".stats"));
  }

  // palette
  COLORS.forEach(function (hex, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "sw" + (i === 0 ? " erase" : "");
    b.style.setProperty("--c", hex);
    b.setAttribute("aria-label", i === 0 ? "Eraser" : "Color " + i);
    b.setAttribute("aria-pressed", String(i === cur));
    b.dataset.i = i;
    b.addEventListener("click", function () { pick(i); });
    palette.appendChild(b);
  });
  function pick(i) {
    cur = i;
    Array.prototype.forEach.call(palette.children, function (el) {
      el.setAttribute("aria-pressed", String(+el.dataset.i === i));
    });
    sendCursor(true);
  }
  document.addEventListener("keydown", function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key >= "0" && e.key <= "9") pick(+e.key);
    if (e.key === "q") pick(10); if (e.key === "w") pick(11); if (e.key === "e") pick(12);
    if (e.key === "r") pick(13); if (e.key === "t") pick(14); if (e.key === "y") pick(15);
  });

  // drawing
  function paintLocal(x, y, c) {
    grid[y * W + x] = c;
    ctx.fillStyle = COLORS[c];
    ctx.fillRect(x, y, 1, 1);
  }
  function redrawAll() {
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      ctx.fillStyle = COLORS[grid[y * W + x]];
      ctx.fillRect(x, y, 1, 1);
    }
  }
  function cellAt(ev) {
    var r = stage.getBoundingClientRect();
    var x = Math.floor(((ev.clientX - r.left) / r.width) * W);
    var y = Math.floor(((ev.clientY - r.top) / r.height) * H);
    return { x: Math.max(0, Math.min(W - 1, x)), y: Math.max(0, Math.min(H - 1, y)) };
  }
  function place(x, y) {
    if (!ws || ws.readyState !== 1) return;
    if (grid[y * W + x] === cur) return;
    paintLocal(x, y, cur);
    ws.send(JSON.stringify({ t: "p", x: x, y: y, c: cur }));
  }
  function line(x0, y0, x1, y1) {
    var dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    var sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx + dy;
    for (;;) {
      place(x0, y0);
      if (x0 === x1 && y0 === y1) break;
      var e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }
  var down = false, last = null;
  stage.addEventListener("pointerdown", function (ev) {
    down = true;
    try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
    var c = cellAt(ev);
    last = c;
    place(c.x, c.y);
    myCell = c; sendCursor();
  });
  stage.addEventListener("pointermove", function (ev) {
    var c = cellAt(ev);
    myCell = c;
    sendCursor();
    if (!down) return;
    if (last) line(last.x, last.y, c.x, c.y); else place(c.x, c.y);
    last = c;
  });
  function up() { down = false; last = null; }
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);

  // cursors
  var myCell = null, lastSent = 0, lastSentKey = "";
  function sendCursor(force) {
    if (!ws || ws.readyState !== 1 || !myCell) return;
    var now = Date.now();
    if (!force && now - lastSent < 60) return;
    var key = myCell.x + "," + myCell.y + "," + cur;
    if (key === lastSentKey) return;
    lastSent = now; lastSentKey = key;
    ws.send(JSON.stringify({ t: "m", x: myCell.x, y: myCell.y, c: cur }));
  }
  var peers = {};
  function peerMove(id, x, y, c) {
    var el = peers[id];
    if (!el) {
      el = document.createElement("div");
      el.className = "peer";
      peersEl.appendChild(el);
      peers[id] = el;
    }
    el.style.left = (x / W) * 100 + "%";
    el.style.top = (y / H) * 100 + "%";
    el.style.background = COLORS[c] || "#fff";
    el.style.opacity = c === 0 ? "0.5" : "1";
  }
  function peerGone(id) {
    if (peers[id]) { peers[id].remove(); delete peers[id]; }
  }
  function clearPeers() { Object.keys(peers).forEach(peerGone); }

  // network
  function fmt(n) { return Number(n).toLocaleString("en-US"); }
  function connect() {
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host);
    ws.onopen = function () { retry = 0; statusEl.textContent = ""; };
    ws.onmessage = function (e) {
      var m; try { m = JSON.parse(e.data); } catch (_) { return; }
      if (m.t === "init") {
        myId = m.id;
        var bin = atob(m.data);
        for (var i = 0; i < W * H; i++) grid[i] = bin.charCodeAt(i) & 15;
        redrawAll();
        onlineEl.textContent = fmt(m.online);
        totalEl.textContent = fmt(m.total);
        dot.classList.add("on");
        veil.hidden = true;
        lastSentKey = "";
        sendCursor(true);
      } else if (m.t === "p") {
        paintLocal(m.x, m.y, m.c);
      } else if (m.t === "m") {
        peerMove(m.id, m.x, m.y, m.c);
      } else if (m.t === "gone") {
        peerGone(m.id);
      } else if (m.t === "online") {
        onlineEl.textContent = fmt(m.n);
      } else if (m.t === "total") {
        totalEl.textContent = fmt(m.n);
      }
    };
    ws.onclose = function () {
      dot.classList.remove("on");
      veil.hidden = false;
      veil.textContent = "RECONNECTING";
      clearPeers();
      retry = Math.min(retry + 1, 6);
      setTimeout(connect, 400 * retry * retry);
    };
    ws.onerror = function () { try { ws.close(); } catch (_) {} };
  }
  redrawAll();
  connect();

  // grid overlay
  var gridCanvas = document.getElementById("grid");
  function drawGrid() {
    var r = stage.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    gridCanvas.width = Math.round(r.width * dpr);
    gridCanvas.height = Math.round(r.height * dpr);
    var g = gridCanvas.getContext("2d");
    g.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
    g.strokeStyle = "rgba(255,255,255,0.07)";
    g.lineWidth = 1;
    var step = gridCanvas.width / W;
    g.beginPath();
    for (var i = 1; i < W; i++) {
      var p = Math.round(i * step) + 0.5;
      g.moveTo(p, 0); g.lineTo(p, gridCanvas.height);
      g.moveTo(0, p); g.lineTo(gridCanvas.width, p);
    }
    g.stroke();
  }
  drawGrid();
  window.addEventListener("resize", drawGrid);
  document.getElementById("gridbtn").addEventListener("click", function () {
    stage.classList.toggle("zoomgrid");
  });

  // save png
  document.getElementById("savebtn").addEventListener("click", function () {
    var S = 8;
    var c = document.createElement("canvas");
    c.width = W * S; c.height = H * S;
    var g = c.getContext("2d");
    g.imageSmoothingEnabled = false;
    g.drawImage(wall, 0, 0, W * S, H * S);
    c.toBlob(function (b) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = "the-wall.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    });
  });
})();
</script>
</body>
</html>
